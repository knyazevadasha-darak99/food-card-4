<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Магазин косметики</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style/style.css" />
    <link rel="stylesheet" href="style/clear-list.css" />
    <link rel="stylesheet" href="style/compound.css" />
    <link rel="stylesheet" href="style/catalog.css" />
    <link rel="stylesheet" href="style/container.css" />
    <link rel="stylesheet" href="style/card.css" />
    <link rel="stylesheet" href="style/products.css" />
  </head>
  <body>
    <main class="catalog">
      <div class="container catalog__container">
        <h1 class="title catalog__title">Выбери свой продукт</h1>
        <button id="change-color-all-card">Сменить цвет всех карточек</button>
        <button id="change-color-first-card">
          Сменить цвет первой карточки
        </button>
        <button id="open-google">Открыть страницу Google.com</button>
        <button id="output-console-log">Вывести сообщение в консоль лог</button>
        <button id="toggle-color-button">Сменить цвет</button>

        <ul class="products" id="products-list">
          <template class="product-template">
            <li class="products__item card">
              <img class="card__image" />
              <span class="card__category"></span>
              <h2 class="card__name"></h2>
              <p class="card__description"></p>

              <div class="card__compound compound">
                <span class="compound__name">Состав:</span>
                <ul class="compound__list">
                  <li class="compound__item"></li>
                  <li class="compound__item"></li>
                  <li class="compound__item"></li>
                </ul>
              </div>

              <div class="card__price">
                <b>Цена</b>
                <span class="card__price-value"></span>
              </div>
            </li>
          </template>
        </ul>
      </div>
    </main>
    <script src="main.js"></script>
    <script src="homework-10.js" type="module"></script>
  </body>
</html>
